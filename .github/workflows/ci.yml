name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Unit tests
        run: uv run pytest -m unit --cov=warpweft --cov-report= --cov-fail-under=0
      - name: Integration & e2e tests (coverage gate 90%, appended)
        run: uv run pytest -m "integration or e2e" --cov=warpweft --cov-append --cov-report=term

  wheel-smoke:
    name: wheel installs into clean venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: uv build -o dist
      - name: Install (base) into a clean venv and import
        run: |
          uv venv /tmp/smoke --python 3.11
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import warpweft; from warpweft import App, AComponent; print(warpweft.__version__)"
      - name: Install with the mcp extra and import warpweft.mcp
        run: |
          uv venv /tmp/smoke-mcp --python 3.11
          uv pip install --python /tmp/smoke-mcp/bin/python "warpweft[mcp] @ $(ls dist/*.whl)"
          /tmp/smoke-mcp/bin/python -c "import warpweft.mcp; from warpweft.mcp import tool; print('mcp extra ok')"
