name: Release

# On every push to main: if pyproject.toml carries a version that has no
# matching tag yet, build it, publish to PyPI (Trusted Publishing / OIDC),
# then tag and cut a GitHub Release. Merges that don't bump the version are
# a no-op (the jobs are skipped), so it's safe to run on every merge.
on:
  push:
    branches: [main]

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: detect version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to know what's already released

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - id: decide
        run: |
          v=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "Tag v$v already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$v — a release will be published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build distributions
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build -o dist
      - name: Validate metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/warpweft/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write # OIDC for Trusted Publishing — no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true # PEP 740 provenance
          skip-existing: true # idempotent on re-runs

  tag:
    name: tag & GitHub Release
    needs: [check, publish]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create and push tag
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "warpweft v$V"
          git push origin "v$V"
      - name: GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: gh release create "v$V" --title "v$V" --generate-notes dist/*
