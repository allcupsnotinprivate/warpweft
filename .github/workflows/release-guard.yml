name: Release guard

# Runs on every PR into main. If the PR bumps the version to a NEW release
# (no matching tag yet), validate it so the post-merge publish can't fail.
# If the version is unchanged — a docs/chore/fix PR that doesn't cut a
# release — the checks are skipped and the job passes: merging just won't
# publish anything (release.yml sees the existing tag and no-ops).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: version is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to know what's already released

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Read version; is it a new release?
        id: ver
        run: |
          v=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Version $v already has tag v$v — no release on merge; nothing to validate."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "Version $v has no tag yet — validating it as a candidate release."
          fi

      - name: Valid PEP 440 and greater than the latest tag
        if: steps.ver.outputs.is_new == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os, subprocess, sys
          from packaging.version import Version, InvalidVersion

          v = os.environ["V"]
          try:
              new = Version(v)
          except InvalidVersion as e:
              sys.exit(f"::error::Invalid PEP 440 version '{v}': {e}")

          tags = subprocess.run(
              ["git", "tag", "-l", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          if tags:
              old = Version(tags[0][1:])
              if new <= old:
                  sys.exit(f"::error::Version {new} must be greater than the latest release {old}.")
          print(f"Version {new} is a valid new release.")
          PY

      - name: Not already published on PyPI
        if: steps.ver.outputs.is_new == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          code=$(curl -sS -o /tmp/pypi.json -w '%{http_code}' "https://pypi.org/pypi/warpweft/json" || echo 000)
          if [ "$code" = "404" ]; then
            echo "warpweft is not on PyPI yet — first release, OK."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::Could not query PyPI (HTTP $code); skipping the duplicate check."
            exit 0
          fi
          if jq -e --arg v "$V" '.releases | has($v)' /tmp/pypi.json >/dev/null; then
            echo "::error::Version $V is already published on PyPI. Bump the version in pyproject.toml."
            exit 1
          fi
          echo "Version $V is free on PyPI."

      - name: Build and validate package metadata
        if: steps.ver.outputs.is_new == 'true'
        run: |
          uv build -o dist
          uvx twine check dist/*
