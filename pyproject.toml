[project]
name = "warpweft"
version = "0.6.1"
description = "A declarative framework for resilient, observable service components."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "allcupsnotinprivate" }]
keywords = ["async", "anyio", "resilience", "observability", "opentelemetry", "mcp", "framework"]
# NOTE: the "Programming Language :: Python :: 3.x" classifiers below drive the
# PyPI "pyversions" badge; without them shields.io renders it as "missing".
# License is declared via the SPDX expression above, so no "License ::" classifier.
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.5",
    "opentelemetry-api>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/allcupsnotinprivate/warpweft"
Repository = "https://github.com/allcupsnotinprivate/warpweft"
Issues = "https://github.com/allcupsnotinprivate/warpweft/issues"

[project.optional-dependencies]
# Expose component invocables as Model Context Protocol tools (warpweft.mcp).
mcp = ["mcp>=2.2,<3"]
# Load configuration from YAML files as well as TOML/JSON.
yaml = ["pydantic-settings[yaml]>=2.5"]

[project.scripts]
warpweft = "warpweft.runtime.cli:main"

[project.entry-points.pytest11]
warpweft = "_warpweft_pytest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warpweft"]
# The pytest plugin ships as a top-level module (see _warpweft_pytest.py for
# why it lives outside the package); force-include places it at the wheel root.
force-include = { "src/_warpweft_pytest.py" = "_warpweft_pytest.py" }

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.2.1",
    "pre-commit>=4.5.1",
    "trio>=0.30",
    "opentelemetry-sdk>=1.26",
    "pydantic-settings[yaml]>=2.15.0",
    "mcp>=2.2,<3",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # Pin below the releases that swapped their mkdocs dep for `properdocs`.
    "mkdocs-gen-files>=0.5,<0.7",
    "mkdocs-literate-nav>=0.6,<0.6.4",
    "mkdocs-section-index>=0.3,<0.3.13",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
fix = true
output-format = "grouped"
exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "B", "S"]
extend-select = ["I", "TID252", "UP", "B", "ASYNC", "RUF100", "PIE", "C4", "SIM"]
ignore = ["B008", "B904"]
extend-unsafe-fixes = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["warpweft"]
force-sort-within-sections = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
exclude = ['/tests/']

# --------------------------------------------------------------------------
# pytest / coverage
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "unit: isolated unit tests",
    "integration: integration tests against real dependencies",
    "e2e: end-to-end tests against a running service",
]
filterwarnings = []

[tool.coverage.run]
branch = true
omit = ["*/__init__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
